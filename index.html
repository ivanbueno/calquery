<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="Get instant answers about California trial courts, legal procedures, and self-help resources. AI assistant for self-represented litigants. Fast, accurate, and court-focused."
  />
  <title>CalQuery | California Court AI Help | Legal Self-Help Chatbot</title>
  <script>
    (function () {
      try {
        var savedTheme = window.localStorage.getItem("calquery-theme");
        if (savedTheme === "kanagawa" || savedTheme === "gruvbox-dark") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      } catch (error) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="./images/bear-logo-soft.png?v=1" />
  <link rel="apple-touch-icon" href="./images/bear-logo-soft.png?v=1" />
  <link rel="stylesheet" href="./themes.css" />
  <link rel="stylesheet" href="./kanagawa-theme.css" />
  <link rel="stylesheet" href="./gruvbox-dark-theme.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="processing-bg bg1" aria-hidden="true"></div>
  <div class="processing-bg bg2" aria-hidden="true"></div>
  <div class="processing-bg bg3" aria-hidden="true"></div>

  <main class="chat-shell">
    <header class="chat-header">
      <button
        id="settingsToggle"
        class="settings-toggle"
        type="button"
        aria-label="Open display settings"
        aria-controls="settingsPanel"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.16 7.16 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.49-.42h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.58.22-1.12.53-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.41 1.05.73 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.84a.5.5 0 0 0 .49-.42l.36-2.54c.58-.22 1.12-.53 1.63-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
        </svg>
      </button>
      <div id="settingsPanel" class="settings-panel" hidden>
        <label class="settings-option" for="toggleRoutingMeta">
          <input id="toggleRoutingMeta" type="checkbox" />
          <span>Show routing system + meta messages</span>
        </label>
        <label class="settings-option settings-control" for="themeSelect">
          <span>Theme</span>
          <select id="themeSelect" name="theme">
            <option value="default">Default</option>
            <option value="kanagawa">Kanagawa</option>
            <option value="gruvbox-dark">Gruvbox Dark</option>
          </select>
        </label>
      </div>
      <div class="brand">
        <img
          class="brand-logo"
          src="./images/bear-logo-soft.png?v=1"
          alt="Bear logo"
          width="44"
          height="44"
        />
        <a class="brand-text" href="/">
          <h1>CalQuery</h1>
          <p class="header-lead">AI Legal Self-Help for California Courts</p>
        </a>
      </div>
    </header>

    <section id="chatLog" class="chat-log"></section>

    <form id="composer" class="composer">
      <textarea id="queryInput" placeholder="Ask a question..."></textarea>
      <div class="actions">
        <button id="sendButton" type="submit">
          <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M21.5 11.3 3.8 3.2a1 1 0 0 0-1.4 1l1.2 6.2a1 1 0 0 0 .8.8l8.1 1.3-8.1 1.3a1 1 0 0 0-.8.8L2.4 21a1 1 0 0 0 1.4 1l17.7-8.1a1.4 1.4 0 0 0 0-2.6Z"/>
          </svg>
          <span>Send</span>
        </button>
      </div>
    </form>

    <footer class="chat-footer">
      <p>&copy; <span id="footerYear"></span> CalQuery. Inquiries: <a href="mailto:dev@ivanbueno.com">dev@ivanbueno.com</a>.</p>
    </footer>
  </main>

  <p class="site-disclaimer">CalQuery provides general legal information, not legal advice. Always verify information with official court sources or a qualified attorney.</p>

  <script src="./app-config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
